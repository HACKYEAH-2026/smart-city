# Produkcja/staging na VPS. Katalog na serwerze: /opt/app (kopiowany przez CI).
# Sekrety w /opt/app/.env (zapisuje CI z GitHub Secrets; wzór: deploy/.env.example).
name: app

x-api: &api
  image: ${API_IMAGE:?ustaw API_IMAGE}:${API_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: file:/data/app.db
  volumes:
    - data:/data

services:
  api:
    <<: *api
    restart: unless-stopped
    expose: ["3000"]

  migrate:
    <<: *api
    command: ["bun", "migrate-cli.js"]
    restart: "no"
    profiles: ["tools"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  backup:
    image: ${BACKUP_IMAGE:?ustaw BACKUP_IMAGE}:${API_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      - data:/data

volumes:
  data:
  caddy_data:
  caddy_config:
