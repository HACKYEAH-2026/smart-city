name: Free up disk space
description: >
  Removes tools preinstalled on ubuntu-latest that we do not use (the runner's Android SDK, .NET, GHC, CodeQL).
  The React Native build (NDK from nix + C++ compilation) does not fit on the runner's default disk without this.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h / | tail -1
