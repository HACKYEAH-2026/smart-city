# CI. MUST be green without secrets: secret-dependent jobs are skipped,
# and the "secrets" job prints a readable note about what is missing.
name: ci

# Automatic runs are OFF for now: `bun run verify` locally is the check (AGENTS.md). Only a manual run
# (Actions -> ci -> Run workflow) starts it. To turn CI back on, uncomment push / pull_request.
on:
  # push:
  #   branches: [master]
  #   tags: ["v*"]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # master: a running CI is never cancelled (pushes come faster than a run takes, so it would never finish);
  # GitHub keeps only the newest push waiting behind it and drops the older pending ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  secrets:
    name: secrets (what is configured)
    runs-on: ubuntu-latest
    outputs:
      android_signing: ${{ steps.s.outputs.android_signing }}
      ios_signing: ${{ steps.s.outputs.ios_signing }}
    steps:
      - id: s
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        run: |
          report() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            if [ "$2" = "true" ]; then echo "OK       $1"; else
              echo "::notice title=Skipped: $1::$3"; echo "MISSING  $1 -> $3"; fi
          }
          report android_signing "$ANDROID_SIGNING" "signed Android release skipped: missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
          report ios_signing "$IOS_SIGNING" "signed iOS build skipped: missing IOS_CERTIFICATE_P12_BASE64 / IOS_CERTIFICATE_PASSWORD / IOS_PROVISIONING_PROFILE_BASE64 / IOS_TEAM_ID"

  verify:
    name: bun run verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size-linux: 8G
      - run: nix develop .#android -c bun install --frozen-lockfile
      - run: nix develop .#android -c bash -c 'cd apps/app && bunx playwright install --with-deps chromium'
      - run: nix develop .#android -c bun run verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/app/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/app/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (unsigned build)
    # Expo SDK 57 / RN 0.86 require the Xcode 26 toolchain (macos-15 defaults to 16.4 -> Swift error in ExpoLogBox).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size-linux: 8G
      - run: nix develop -c bun install --frozen-lockfile
      - name: expo prebuild (ios/ generated from app.config.ts, CocoaPods from the runner)
        run: nix develop -c bash -c 'cd apps/app && CI=1 bunx expo prebuild --platform ios'
      - name: xcodebuild (simulator, CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace apps/app/ios/TwojeMiejsce.xcworkspace -scheme TwojeMiejsce -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: signed archive (only with secrets)
        if: needs.secrets.outputs.ios_signing == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
        run: bash apps/app/scripts/ios-sign.sh
      - uses: actions/upload-artifact@v7
        if: needs.secrets.outputs.ios_signing == 'true' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: ios-ipa
          path: build/ios-export/*.ipa
    needs: [secrets]

  android-release:
    name: Android release (signed)
    needs: [secrets, verify]
    if: needs.secrets.outputs.android_signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size-linux: 8G
      - run: nix develop .#android -c bun install --frozen-lockfile
      - env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_API_URL || vars.STAGING_API_URL }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Signing via properties injected into AGP — no keystore or passwords in the generated project.
          nix develop .#android -c bash -c 'cd apps/app && CI=1 bunx expo prebuild --platform android --no-install \
            && cd android && ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"'
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: apps/app/android/app/build/outputs/bundle/release/*.aab

  images:
    name: images -> GHCR
    needs: [verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$owner/$repo-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.api }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  release:
    name: GitHub Release (mobile artifacts)
    needs: [verify, ios, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{android-*,ios-ipa}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -print
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes \
            $(find artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \))