# No automatic .env loading: the repo-root .env holds local dev secrets (e.g. AI_API_KEY) that tests, E2E and
# verify must never see. Only the dev servers load it, explicitly (`--env-file` in the dev scripts of apps/api and
# apps/app; Expo puts only EXPO_PUBLIC_* variables into the app).
env = false

[install]
# React Native / Metro need a flat node_modules (Bun's isolated linker breaks Expo CLI module resolution).
linker = "hoisted"

[test]
preload = ["./packages/sdk/src/test-preload.ts"]
